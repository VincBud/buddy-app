<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Buddy App – Buddy auswählen (Demo)">
  <defs>
    <linearGradient id="bg02" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEFCFD"/>
      <stop offset="100%" stop-color="#F4F2F7"/>
    </linearGradient>
    <style>
      .t { font-family: system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; fill:#2A2D34; }
      .muted { fill:#6B6E78; }
      .label { font-size:11px; font-weight:700; letter-spacing:1.5px; }
    </style>
  </defs>

  <rect width="390" height="844" fill="url(#bg02)"/>

  <!-- status bar -->
  <text x="32" y="32" class="t" font-size="14" font-weight="700">9:41</text>
  <g transform="translate(316,22)" fill="#2A2D34">
    <rect x="0" y="4" width="18" height="10" rx="2"/>
    <rect x="22" y="4" width="22" height="10" rx="3" fill="none" stroke="#2A2D34" stroke-width="1.5"/>
    <rect x="24" y="6" width="14" height="6" rx="1"/>
  </g>

  <!-- header -->
  <text x="24" y="86" class="t muted" font-size="13">← Zurück</text>
  <text x="24" y="124" class="t" font-size="26" font-weight="800">Bewerbungen</text>
  <text x="24" y="148" class="t muted" font-size="13">3 Buddies in deinem Radius haben sich gemeldet.</text>

  <!-- Card 1 (selected) -->
  <g transform="translate(24,178)">
    <rect x="0" y="0" width="342" height="170" rx="18" fill="#FFFFFF" stroke="#6761A8" stroke-width="2"/>
    <circle cx="44" cy="44" r="28" fill="#6761A8"/>
    <text x="44" y="52" text-anchor="middle" font-size="20" font-weight="700" fill="#FEFCFD" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">L</text>
    <text x="86" y="38" class="t" font-size="17" font-weight="700">Lena R.</text>
    <text x="86" y="60" class="t muted" font-size="12">2,1 km · meist binnen 15 min vor Ort</text>
    <g transform="translate(86,76)">
      <text x="0" y="14" font-size="13" font-weight="600" fill="#FF4000" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">★ 4,9</text>
      <text x="48" y="14" class="t muted" font-size="13">·</text>
      <text x="58" y="14" class="t" font-size="13" font-weight="600">12 Jobs</text>
      <text x="124" y="14" class="t muted" font-size="13">·</text>
      <text x="134" y="14" class="t" font-size="13" font-weight="600">98 % Quote</text>
    </g>
    <text x="20" y="138" class="t" font-size="22" font-weight="800">25 €</text>
    <rect x="200" y="118" width="124" height="36" rx="18" fill="#6761A8"/>
    <text x="262" y="141" text-anchor="middle" font-size="13" font-weight="700" fill="#FEFCFD" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">Ausgewählt ✓</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(24,366)">
    <rect x="0" y="0" width="342" height="148" rx="18" fill="#FFFFFF" stroke="#E9E7EC"/>
    <circle cx="44" cy="44" r="28" fill="#FF4000"/>
    <text x="44" y="52" text-anchor="middle" font-size="20" font-weight="700" fill="#FEFCFD" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">T</text>
    <text x="86" y="38" class="t" font-size="17" font-weight="700">Tobias K.</text>
    <text x="86" y="60" class="t muted" font-size="12">1,4 km · oft kurzfristig verfügbar</text>
    <g transform="translate(86,76)">
      <text x="0" y="14" font-size="13" font-weight="600" fill="#FF4000" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">★ 4,7</text>
      <text x="48" y="14" class="t muted" font-size="13">·</text>
      <text x="58" y="14" class="t" font-size="13" font-weight="600">5 Jobs</text>
    </g>
    <text x="20" y="124" class="t" font-size="22" font-weight="800">25 €</text>
    <rect x="200" y="104" width="124" height="36" rx="18" fill="#fff" stroke="#6761A8"/>
    <text x="262" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#6761A8" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">Auswählen</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(24,530)">
    <rect x="0" y="0" width="342" height="148" rx="18" fill="#FFFFFF" stroke="#E9E7EC"/>
    <circle cx="44" cy="44" r="28" fill="#2A2D34"/>
    <text x="44" y="52" text-anchor="middle" font-size="20" font-weight="700" fill="#FEFCFD" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">M</text>
    <text x="86" y="38" class="t" font-size="17" font-weight="700">Mira P.</text>
    <text x="86" y="60" class="t muted" font-size="12">3,0 km · meldet sich am schnellsten</text>
    <g transform="translate(86,76)">
      <text x="0" y="14" font-size="13" font-weight="600" fill="#FF4000" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">★ 5,0</text>
      <text x="48" y="14" class="t muted" font-size="13">·</text>
      <text x="58" y="14" class="t" font-size="13" font-weight="600">8 Jobs</text>
    </g>
    <text x="20" y="124" class="t" font-size="22" font-weight="800">25 €</text>
    <rect x="200" y="104" width="124" height="36" rx="18" fill="#fff" stroke="#6761A8"/>
    <text x="262" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#6761A8" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">Auswählen</text>
  </g>

  <!-- Continue CTA -->
  <rect x="24" y="710" width="342" height="56" rx="28" fill="#FF4000"/>
  <text x="195" y="746" text-anchor="middle" font-size="17" font-weight="800" fill="#FEFCFD" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">Mit Lena weiter</text>
  <text x="320" y="746" text-anchor="middle" font-size="18" font-weight="800" fill="#FEFCFD" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">→</text>

  <!-- home indicator -->
  <rect x="135" y="822" width="120" height="5" rx="2.5" fill="#2A2D34" opacity="0.2"/>
</svg>
