<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Buddy App – Chat zwischen Auftraggeber und Buddy (Demo)">
  <defs>
    <linearGradient id="bg03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEFCFD"/>
      <stop offset="100%" stop-color="#F4F2F7"/>
    </linearGradient>
    <style>
      .t { font-family: system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; fill:#2A2D34; }
      .muted { fill:#6B6E78; }
    </style>
  </defs>

  <rect width="390" height="844" fill="url(#bg03)"/>

  <!-- status bar -->
  <text x="32" y="32" class="t" font-size="14" font-weight="700">9:41</text>
  <g transform="translate(316,22)" fill="#2A2D34">
    <rect x="0" y="4" width="18" height="10" rx="2"/>
    <rect x="22" y="4" width="22" height="10" rx="3" fill="none" stroke="#2A2D34" stroke-width="1.5"/>
    <rect x="24" y="6" width="14" height="6" rx="1"/>
  </g>

  <!-- chat header -->
  <rect x="0" y="60" width="390" height="84" fill="#FFFFFF"/>
  <line x1="0" y1="144" x2="390" y2="144" stroke="#E9E7EC"/>
  <text x="24" y="92" class="t muted" font-size="13">← Bewerbungen</text>
  <g transform="translate(24,110)">
    <circle cx="14" cy="14" r="14" fill="#6761A8"/>
    <text x="14" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#FEFCFD" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">L</text>
    <text x="36" y="14" class="t" font-size="15" font-weight="700">Lena R.</text>
    <circle cx="46" cy="26" r="4" fill="#3DC55B"/>
    <text x="56" y="29" class="t muted" font-size="12">jetzt aktiv</text>
  </g>

  <!-- date pill -->
  <rect x="160" y="166" width="70" height="22" rx="11" fill="#FFFFFF" stroke="#E9E7EC"/>
  <text x="195" y="181" class="t muted" text-anchor="middle" font-size="11" font-weight="600">Heute</text>

  <!-- Bubble: outgoing (user, flame) -->
  <g transform="translate(110,210)">
    <rect x="0" y="0" width="256" height="48" rx="18" fill="#FF4000"/>
    <text x="20" y="30" font-size="14" font-weight="500" fill="#FEFCFD" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">Hi! Wo treffen wir uns?</text>
    <text x="232" y="68" class="t muted" text-anchor="end" font-size="11">10:22</text>
  </g>

  <!-- Bubble: incoming (buddy, mist) -->
  <g transform="translate(24,294)">
    <rect x="0" y="0" width="280" height="48" rx="18" fill="#FFFFFF" stroke="#E9E7EC"/>
    <text x="20" y="30" class="t" font-size="14" font-weight="500">Hi, ich bin in 15 Minuten da.</text>
    <text x="48" y="68" class="t muted" font-size="11">10:23 · Lena R.</text>
  </g>

  <!-- Bubble: outgoing -->
  <g transform="translate(150,378)">
    <rect x="0" y="0" width="216" height="48" rx="18" fill="#FF4000"/>
    <text x="20" y="30" font-size="14" font-weight="500" fill="#FEFCFD" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">Perfekt, danke dir!</text>
    <text x="192" y="68" class="t muted" text-anchor="end" font-size="11">10:23 · gelesen ✓✓</text>
  </g>

  <!-- Bubble: incoming -->
  <g transform="translate(24,462)">
    <rect x="0" y="0" width="240" height="48" rx="18" fill="#FFFFFF" stroke="#E9E7EC"/>
    <text x="20" y="30" class="t" font-size="14" font-weight="500">Bin am Hinterausgang.</text>
    <text x="48" y="68" class="t muted" font-size="11">10:34 · Lena R.</text>
  </g>

  <!-- typing indicator -->
  <g transform="translate(24,540)">
    <rect x="0" y="0" width="92" height="36" rx="18" fill="#FFFFFF" stroke="#E9E7EC"/>
    <circle cx="22" cy="18" r="3" fill="#6B6E78"/>
    <circle cx="34" cy="18" r="3" fill="#6B6E78" opacity="0.7"/>
    <circle cx="46" cy="18" r="3" fill="#6B6E78" opacity="0.45"/>
    <text x="62" y="22" class="t muted" font-size="11" font-weight="600">tippt</text>
  </g>

  <!-- Job context strip -->
  <g transform="translate(24,610)">
    <rect x="0" y="0" width="342" height="60" rx="14" fill="#F4F2F7"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#6761A8" opacity="0.15"/>
    <text x="30" y="35" text-anchor="middle" font-size="14" font-weight="800" fill="#6761A8" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">📦</text>
    <text x="56" y="28" class="t" font-size="13" font-weight="700">Hilfe beim Tragen eines Regals</text>
    <text x="56" y="46" class="t muted" font-size="12">heute · 20 € · 2,1 km</text>
  </g>

  <!-- composer -->
  <rect x="0" y="708" width="390" height="116" fill="#FFFFFF"/>
  <line x1="0" y1="708" x2="390" y2="708" stroke="#E9E7EC"/>
  <rect x="24" y="728" width="246" height="46" rx="23" fill="#F4F2F7"/>
  <text x="44" y="757" class="t muted" font-size="14">Nachricht …</text>
  <g transform="translate(284,728)">
    <rect x="0" y="0" width="46" height="46" rx="23" fill="#FFFFFF" stroke="#E9E7EC"/>
    <path d="M14 23l8 -8 a4 4 0 0 1 6 6 l-10 10 a6 6 0 0 1 -9 -9 l11 -11" stroke="#6B6E78" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(338,728)">
    <rect x="0" y="0" width="46" height="46" rx="23" fill="#FF4000"/>
    <path d="M14 23l18 -10 -6 10 6 10 z" fill="#FEFCFD"/>
  </g>

  <!-- home indicator -->
  <rect x="135" y="822" width="120" height="5" rx="2.5" fill="#2A2D34" opacity="0.2"/>
</svg>
